name: Publish Linux binary release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang libclang-dev libegl-dev libgl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build release binary
        run: cargo build --release
      - name: Package binary
        run: |
          tar -czf "vrperf-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release vrperf
          sha256sum "vrperf-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" > "vrperf-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "vrperf-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" "vrperf-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256" --title "vrperf $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
